name: Update Data & Deploy Dashboard

on:
  schedule:
    - cron: '0 12 * * 2'   # Every Tuesday at 6:00 AM Mexico City time (UTC-6)
  workflow_dispatch:        # Allow manual runs from GitHub UI

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    env:
      DATA_DIR: ${{ github.workspace }}/data
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python: SkillCorner data via Jupyter notebooks ──────────────────────

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run physical.ipynb (physical metrics)
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=600 \
            notebooks/physical.ipynb
        env:
          SC_USERNAME: ${{ secrets.SC_USERNAME }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}

      - name: Run data_scout_dashboard.ipynb (passes, off-ball runs, pressures)
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            --ExecutePreprocessor.timeout=600 \
            notebooks/data_scout_dashboard.ipynb
        env:
          SC_USERNAME: ${{ secrets.SC_USERNAME }}
          SC_PASSWORD: ${{ secrets.SC_PASSWORD }}

      # ── R: StatsBomb fetch → SkillCorner processing → join → deploy ─────────

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
          use-public-rspm: true   # use pre-built CRAN binaries (faster)

      - name: Restore R packages via renv
        uses: r-lib/actions/setup-renv@v2

      - name: Fetch StatsBomb data
        run: Rscript dashboard_scout.R
        env:
          SB_USERNAME: ${{ secrets.SB_USERNAME }}
          SB_PASSWORD: ${{ secrets.SB_PASSWORD }}

      # TEMPORARY -- for pulling a fresh player_name/team_name list out to
      # refresh the Transfermarkt crosswalk after the 15-league expansion.
      # Remove these two steps once that one-off pull is done.
      - name: (TEMP) Extract player list for Transfermarkt refresh
        run: |
          Rscript -e '
            scout_data <- readRDS("data/scout_data.rds")
            rows <- lapply(scout_data, function(df) {
              if (is.null(df) || !is.data.frame(df) || nrow(df) == 0) return(NULL)
              if (!all(c("player_name","team_name") %in% names(df))) return(NULL)
              unique(df[, c("player_name","team_name")])
            })
            players <- unique(do.call(rbind, rows))
            write.csv(players, "sb_players_list_fresh.csv", row.names = FALSE)
            cat("Wrote", nrow(players), "player rows\n")
          '

      - name: (TEMP) Upload fresh player list artifact
        uses: actions/upload-artifact@v4
        with:
          name: sb-players-list-fresh
          path: sb_players_list_fresh.csv
          retention-days: 5

      - name: Process SkillCorner data
        run: Rscript sc_data.R

      - name: Join StatsBomb + SkillCorner datasets
        run: Rscript join_scout_data.R

      # Builds data/app_cache/*.rds: the expensive cross-league derived
      # tables (get_all_players_df(), get_db_master(),
      # get_all_players_sc_df(), etc.) that app.R would otherwise compute
      # lazily on a live worker's first touch of each tab. Doing it here,
      # on a runner with far more memory headroom than a shinyapps.io
      # worker is what stopped worker containers from getting OOM-killed
      # under normal use. One file per table (not one combined bundle) so
      # a worker only pays for the table its first-touched getter actually
      # needs, instead of a single readRDS() pulling all six into memory
      # for the very first getter call of the session.
      - name: Precompute app cache
        run: Rscript precompute_app_cache.R

      - name: Write secrets.R for the scouting chatbot
        run: |
          echo "Sys.setenv(ANTHROPIC_API_KEY = \"$ANTHROPIC_API_KEY\")" > secrets.R
        env:
          ANTHROPIC_API_KEY: ${{ secrets.SCOUT_DASHBOARD_CHATBOT }}

      - name: Deploy to ShinyApps.io
        run: |
          Rscript -e "
            rsconnect::setAccountInfo(
              name   = 'mateo-rodriguez-23',
              token  = Sys.getenv('SHINYAPPS_TOKEN'),
              secret = Sys.getenv('SHINYAPPS_SECRET')
            )
            rsconnect::deployApp(
              appName     = 'club-america-scouting_dashboard',
              appFiles    = c('app.R', 'radars.R', 'chatbot.R', 'scout_chat_system_prompt.md',
                               'secrets.R', 'data/scout_joined.rds', 'data/transfermarkt_crosswalk.csv',
                               list.files('data/app_cache', full.names = TRUE)),
              forceUpdate = TRUE
            )
          "
        env:
          SHINYAPPS_TOKEN: ${{ secrets.SHINYAPPS_TOKEN }}
          SHINYAPPS_SECRET: ${{ secrets.SHINYAPPS_SECRET }}
